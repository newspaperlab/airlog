ing:0 23px}.reading p{font-size:17px;line-height:1.95}.reading h2{font-size:23px}.cover{padding:0;margin-bottom:35px}.cover figcaption{padding:0 22px}.footer{margin:45px 20px 0;gap:20px;line-height:1.8}}</style></head><body><div class="topline"><header><a class="brand" href="./">AIRLOG<small>NEWSPAPER LAB · DAILY JOURNAL</small></a><nav class="languages"><a class="selected" href="./?lang=ko">KO</a><a class="" href="./?lang=en">EN</a><a class="" href="./?lang=ja">JA</a><a class="" href="./?lang=zh">中文</a></nav></header></div><div class="schedule">매일 오전 7시, 새로운 기사를 전합니다.</div><main class="wrap"><div class="mast"><h1 id="latest">최신 기사</h1><input type="search" id="search" aria-label="기사 검색" placeholder="기사 검색"></div><div id="stories"></div></main><script>const L={"ko": ["매일 오전 7시, 새로운 기사를 전합니다.", "최신 기사", "기사 검색", "전체 기사", "출처 및 참고 자료", "AI 생성 일러스트 · 실제 촬영 사진이 아닙니다.", "Newspaper Lab 편집", "읽기", "분"], "en": ["Fresh stories every morning at 7 AM KST.", "Latest stories", "Search stories", "All stories", "Sources & further reading", "AI-generated illustration · not a documentary photograph.", "Newspaper Lab", "Read", "min"], "ja": ["毎朝7時（韓国時間）、新しい記事をお届けします。", "最新の記事", "記事を検索", "すべての記事", "情報源と参考資料", "AI生成イラスト・実際の撮影写真ではありません。", "Newspaper Lab 編集", "読む", "分"], "zh": ["每天韩国时间早上7点，为你带来新文章。", "最新文章", "搜索文章", "全部文章", "来源与参考资料", "AI生成插画，非实拍照片。", "Newspaper Lab 编辑", "阅读", "分钟"]};let lang=new URL(location).searchParams.get('lang')||localStorage.getItem('language')||'ko';if(!L[lang])lang='ko';let data={"updated": "2026-11-03", "articles": [{"id": "atlantic-a320neo-20261027", "date": "2026-10-27", "source": "Airbus", "url": "https://www.airbus.com/en/newsroom/press-releases/2026-10-atlantic-airways-orders-two-additional-airbus-a320neo-aircraft", "category": {"ko": "항공사", "en": "Airlines", "ja": "航空会社", "zh": "航空公司"}, "locales": {"ko": {"title": "Atlantic Airways, A320neo 2대 추가 주문", "summary": "Airbus는 페로제도 항공사 Atlantic Airways가 A320neo 두 대를 추가 주문했다고 발표했습니다.", "body": "어떤 항공사인가\nAtlantic Airways는 북대서양 페로제도의 항공사다. 본사는 쇠르보구르에 있으며, 1987년 설립돼 1988년 코펜하겐행 첫 비행을 시작했다. 바가르 공항의 소개에 따르면 국제선뿐 아니라 제도 내 헬리콥터 운항도 맡는다. 이 회사에 비행기는 관광 상품이면서 섬과 외부를 잇는 교통수단이다.\n\n두 대의 주문, 핵심은 기종 전환\nAirbus가 10월 27일 발표한 계약은 A320neo 두 대의 확정 주문이다. 발표 당시 회사는 A320ceo 두 대와 A320neo 두 대를 운항하고 있었다. 목표는 단순한 숫자 확대보다 A320neo 중심의 기단으로 전환하는 데 있다. 따라서 주문 두 대를 현재 네 대에 그대로 더해 장래 기단이 여섯 대라고 단정해서는 안 된다. 기존 항공기의 퇴역과 인도 시점이 함께 작용하기 때문이다.\n\n여행객에게 무엇이 달라질까\n여기서 눈여겨볼 부분은 운항의 일관성이다. 같은 계열의 기재로 전환하면 부품·정비와 운항 계획을 정리하기 쉬워질 수 있다는 것이 이번 발표를 읽는 관점이다. 다만 이는 운영상 기대에 대한 설명이며, 개별 항공편의 정시성이나 운임 인하를 보장한다는 뜻은 아니다.\n\n예약 전 확인할 것\n새 항공기 계약은 새 노선 취항 공지가 아니다. 여행객은 실제 운항일, 항공편 번호, 연결 일정과 수하물 규정을 별도로 살펴봐야 한다. 이번 뉴스의 핵심은 당장 좌석이 늘어난다는 약속보다, 작은 섬의 항공사가 앞으로 어떤 기재로 연결망을 운영할지 방향을 제시했다는 점이다."}, "en": {"title": "Atlantic Airways orders two more A320neo aircraft", "summary": "Airbus announced an order for two additional A320neo aircraft from Atlantic Airways, the Faroe Islands airline.", "body": "Meet the airline\nAtlantic Airways serves the Faroe Islands in the North Atlantic. Based in Sørvágur, it was founded in 1987 and began flying to Copenhagen in 1988. Vágar Airport also describes its role in local helicopter services. For an island airline, the aircraft is both a tourism business and a connection with the outside world.\n\nTwo orders, a fleet transition\nAirbus announced a firm order for two A320neo aircraft on October 27. At the time, the carrier operated two A320ceo and two A320neo aircraft. The stated direction is a transition to an all-A320neo fleet. Adding the order to the existing fleet and assuming a future total of six would therefore be premature: retirements and delivery timing matter too.\n\nWhat could change for passengers?\nOur reading is that operational consistency is the interesting part. A more unified fleet can make maintenance and operating plans easier to organize. That is an interpretation of the operational objective, not a promise of lower fares or on-time performance on any particular flight.\n\nWhat to check before booking\nAn aircraft purchase is not a new-route announcement. Travelers should still check dates, flight numbers, connections and baggage rules. The significance is the direction of fleet renewal, rather than an immediate guarantee of additional seats."}, "ja": {"title": "Atlantic Airways、A320neoを2機追加発注", "summary": "Airbusは、フェロー諸島のAtlantic AirwaysがA320neoを2機追加発注したと発表しました。", "body": "どんな航空会社か\nAtlantic Airwaysは北大西洋のフェロー諸島を拠点とする航空会社だ。本社はソルヴァーグルにあり、1987年に設立、1988年にコペンハーゲンへの初便を運航した。ヴォーアル空港は、同社が島内のヘリコプター運航も担うと紹介している。島の航空会社にとって、飛行機は観光商品であると同時に外の世界との交通手段でもある。\n\n2機発注の意味\nAirbusは10月27日、A320neoを2機確定発注したと発表した。当時の機材はA320ceoが2機、A320neoが2機。目標はA320neoへの統一であり、現在の4機に発注分を加えて将来6機になると断定することはできない。退役と受領の時期が関わるからだ。\n\n旅行者への影響をどう読むか\n注目点は運用の一貫性だ。機材の統一は整備や運航計画の整理につながり得る、というのが本誌の読み方である。ただし個別便の定時性や運賃の値下げを保証するものではない。\n\n予約前の確認事項\n購入契約と新路線の発表は別の話だ。旅行者は実際の運航日、便名、乗り継ぎ、手荷物規則を確認したい。このニュースは、直ちに座席が増えるという約束ではなく、今後どの機材で島を結ぶのかを示している。"}, "zh": {"title": "Atlantic Airways增订两架A320neo", "summary": "Airbus宣布，法罗群岛航空公司Atlantic Airways增订两架A320neo飞机。", "body": "这是一家什么航空公司\nAtlantic Airways服务于北大西洋的法罗群岛，总部位于瑟沃格。公司于1987年成立，并于1988年开始飞往哥本哈根。沃格机场的介绍还提到其岛内直升机业务。对于岛屿航空公司，飞机既服务旅游，也承担对外交通的作用。\n\n两架订单，重点是机队转型\nAirbus于10月27日宣布两架A320neo的确认订单。当时该公司运营两架A320ceo和两架A320neo，目标是转向全A320neo机队。因此，不能简单地把现有四架加上新订单，就认定未来一定有六架；退役安排与交付时间同样重要。\n\n旅客可以如何理解\n我们的观察重点是运营的一致性。更统一的机队有可能便于安排维修和运营计划。这是对运营目标的分析，并非对某一航班准点率或票价下降的保证。\n\n订票前仍须确认\n购机合同不等于新航线公告。旅客应另外查看实际运营日期、航班号、中转安排和行李规则。这条新闻的意义在于说明机队更新方向，而不是立即增加座位的承诺。"}}, "sources": [{"name": "Airbus", "url": "https://www.airbus.com/en/newsroom/press-releases/2026-10-atlantic-airways-orders-two-additional-airbus-a320neo-aircraft"}, {"name": "Vágar Airport · Airline background", "url": "https://www.fae.fo/en/travel-information/airlines/atlantic-airways"}], "image": {"url": "assets/cover.svg", "generated": true, "alt": {"ko": "기사 주제의 AI 일러스트", "en": "AI illustration of the article topic", "ja": "記事テーマのAIイラスト", "zh": "文章主题的AI插画"}}}]};const $=s=>document.querySelector(s);function render(){localStorage.setItem('language',lang);document.documentElement.lang=lang==='zh'?'zh-Hans':lang;$('.schedule').textContent=L[lang][0];$('#latest').textContent=L[lang][1];$('#search').placeholder=L[lang][2];document.querySelectorAll('.languages a').forEach(e=>{e.classList.toggle('selected',new URL(e.href).searchParams.get('lang')===lang)});const q=$('#search').value.toLowerCase(),items=data.articles.filter(a=>(a.locales[lang].title+a.locales[lang].summary).toLowerCase().includes(q));const container=$('#stories');container.replaceChildren();for(const [i,a]of items.entries()){const v=a.locales[lang],article=document.createElement('article');article.className=i===0?'lead':'secondary';const link=document.createElement('a');link.href='articles/'+a.id+'/'+lang+'.html';const img=document.createElement('img');img.src=a.image?.url||'';img.alt=a.image?.alt?.[lang]||'';link.append(img);const copy=document.createElement('div');for(const [tag,c,txt]of [['p','kicker',a.category[lang]],['h2','',v.title],['p','summary',v.summary],['p','meta',a.date+' · NEWSPAPER LAB']]){const e=document.createElement(tag);e.className=c;e.textContent=txt;copy.append(e)}const go=document.createElement('a');go.className='arrow';go.href=link.href;go.textContent=L[lang][7]+' ↗';copy.append(go);article.append(link,copy);container.append(article)}if(!items.length)container.textContent='—';}$('#search').oninput=render;render();fetch('./news.json').then(r=>r.json()).then(d=>{data=d;render()}).catch(()=>{});</script><footer class="footer"><span>AIRLOG / NEWSPAPER LAB</span><span>© 2026 · 매일 오전 7시, 새로운 기사를 전합니다.</span></footer></body></html>
